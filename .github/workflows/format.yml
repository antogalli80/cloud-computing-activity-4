# Task 4 of the activity: "Add a GitHub action to check the format each time
# there is a pull request".
#
# It is deliberately separate from ci.yml and deliberately fast: formatting is
# the cheapest possible feedback, so it should not wait behind Docker builds,
# databases or integration tests. A contributor learns within seconds whether
# the diff is well formatted.
name: Format

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same pull request cancels the previous run: only the
  # latest commit is worth checking.
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Black and Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install formatting tools
        run: python -m pip install --requirement requirements/development.txt

      # --check --diff fails the job and prints exactly what would change, so
      # the fix is copy-pasteable from the log.
      - name: Check formatting with Black
        run: black --config .black --check --diff app tests scripts

      - name: Lint with Ruff
        run: ruff check --no-cache app tests scripts
